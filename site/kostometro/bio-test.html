<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kostometro · δοκιμή δακτυλικού (Η.0) v2</title>
<style>
  body{margin:0;background:#0a0e14;color:#e6edf3;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#8b98a5;font-size:13px;margin-bottom:18px}
  button{display:block;width:100%;padding:16px;margin:10px 0;border:0;border-radius:12px;font-size:17px;font-weight:600;background:#1c2430;color:#e6edf3}
  button.go{background:#00E5A0;color:#0a0e14}
  button:disabled{opacity:.4}
  #log{background:#111822;border-radius:12px;padding:12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;min-height:90px;margin-top:14px}
  .ok{color:#00E5A0}.bad{color:#ff6b6b}.mid{color:#ffd166}
  #sum{margin-top:14px;padding:12px;border:1px solid #00E5A0;border-radius:12px;font:14px ui-monospace,Menlo,Consolas,monospace;word-break:break-all;display:none}
</style>
</head>
<body>
<h1>Δοκιμή δακτυλικού μέσα από PWA</h1>
<div class="sub">Brief Α, βήμα Η.0 — <b>v2</b>. Τρία κουμπιά με τη σειρά. Στο τέλος πάτα «Αντιγραφή» και στείλε τη γραμμή στον Claude.</div>

<button id="b1" class="go">1 · Έλεγχος συσκευής</button>
<button id="b2" disabled>2 · Καταχώριση δακτυλικού</button>
<button id="b3" disabled>3 · Ξεκλείδωμα με δακτυλικό</button>
<button id="b4" disabled>Αντιγραφή αποτελέσματος</button>

<div id="log">Πάτα το 1.</div>
<div id="sum"></div>

<script>
(function(){
  var log = document.getElementById('log'), sum = document.getElementById('sum');
  var b1=document.getElementById('b1'), b2=document.getElementById('b2'), b3=document.getElementById('b3'), b4=document.getElementById('b4');
  var R = { avail:null, create:null, get:null, tCreate:null, tGet:null, err:'' };
  var credId = null;

  function line(t, cls){ var s=document.createElement('div'); if(cls) s.className=cls; s.textContent=t; log.appendChild(s); }
  function clear(){ log.textContent=''; }
  function b64(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function unb64(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; var b=atob(s), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a.buffer; }
  function rnd(n){ var a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
  function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
  function ua(){ var u=navigator.userAgent; var b = /Brave/.test(u)?'Brave':(navigator.brave?'Brave':(/Edg\//.test(u)?'Edge':(/Chrome\//.test(u)?'Chrome':(/Safari\//.test(u)?'Safari':'?')))); var os=/Android/.test(u)?'Android':(/iPhone|iPad/.test(u)?'iOS':'other'); return b+'/'+os; }
  function summary(){
    var s = 'BIO v2 ' + (R.get===true?'✅':(R.create===true?'🟡':'❌'))
      + ' · avail:' + (R.avail===null?'?':(R.avail?'yes':'no'))
      + ' · create:' + (R.create===null?'-':(R.create?('ok '+R.tCreate+'s'):'FAIL'))
      + ' · get:' + (R.get===null?'-':(R.get?('ok '+R.tGet+'s'):'FAIL'))
      + ' · standalone:' + (standalone()?'yes':'no')
      + ' · ' + ua()
      + (R.err?(' · err: '+R.err):'');
    sum.textContent = s; sum.style.display='block'; b4.disabled=false;
    return s;
  }

  b1.onclick = function(){
    clear();
    line('Browser: ' + ua() + ' · standalone: ' + (standalone()?'ναι':'όχι (ανοιχτό σε καρτέλα)'));
    if (!window.PublicKeyCredential) { R.avail=false; R.err='no WebAuthn'; line('❌ Ο browser δεν υποστηρίζει WebAuthn.', 'bad'); summary(); return; }
    if (!window.isSecureContext) { R.avail=false; R.err='not secure'; line('❌ Όχι HTTPS.', 'bad'); summary(); return; }
    PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(ok){
      R.avail = ok;
      line(ok ? '✅ Υπάρχει δακτυλικό/PIN συσκευής διαθέσιμο στον browser.' : '❌ Ο browser λέει ότι ΔΕΝ υπάρχει διαθέσιμο δακτυλικό/PIN.', ok?'ok':'bad');
      b2.disabled = !ok; if(!ok) summary();
    }).catch(function(e){ R.avail=false; R.err=String(e.name||e); line('❌ '+e, 'bad'); summary(); });
  };

  b2.onclick = function(){
    line('… ζητάω καταχώριση — πρέπει να εμφανιστεί το δακτυλικό της συσκευής');
    var t0 = performance.now();
    navigator.credentials.create({ publicKey: {
      rp: { name: 'Kostometro', id: location.hostname },
      user: { id: rnd(16), name: 'test@kostometro', displayName: 'Δοκιμή Η.0' },
      challenge: rnd(32),
      pubKeyCredParams: [{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      timeout: 60000, attestation: 'none'
    }}).then(function(c){
      R.create = true; R.tCreate = ((performance.now()-t0)/1000).toFixed(1);
      credId = b64(c.rawId);
      try { localStorage.setItem('km_biotest_cred', credId); } catch(e){}
      line('✅ Καταχωρίστηκε σε '+R.tCreate+'s. Τώρα το 3.', 'ok');
      b3.disabled = false;
    }).catch(function(e){
      R.create = false; R.err = String(e.name||e);
      line('❌ Καταχώριση απέτυχε: '+(e.name||'')+' — '+(e.message||e), 'bad'); summary();
    });
  };

  function doGet(label, allow){
    var t0 = performance.now();
    return navigator.credentials.get({ publicKey: {
      challenge: rnd(32), rpId: location.hostname, userVerification: 'required', timeout: 60000,
      allowCredentials: allow
    }}).then(function(a){
      var t = ((performance.now()-t0)/1000).toFixed(1);
      return { ok:true, label:label, t:t };
    }).catch(function(e){
      var t = ((performance.now()-t0)/1000).toFixed(1);
      return { ok:false, label:label, t:t, name:String(e.name||e), msg:String(e.message||'') };
    });
  }
  b3.onclick = function(){
    var id = credId || (function(){ try{return localStorage.getItem('km_biotest_cred');}catch(e){return null;} })();
    line('… Τρόπος Α: ζητάω ΑΥΤΟ το κλειδί (allowCredentials)');
    var allowA = id ? [{ type:'public-key', id: unb64(id), transports:['internal'] }] : [];
    doGet('A', allowA).then(function(rA){
      if (rA.ok) { R.get=true; R.tGet=rA.t; R.err='A ok'; line('✅ Τρόπος Α ξεκλείδωσε σε '+rA.t+'s. Η δοκιμή ΠΕΡΑΣΕ.', 'ok'); summary(); return; }
      line('❌ Τρόπος Α απέτυχε σε '+rA.t+'s: '+rA.name+' — '+rA.msg, 'bad');
      line('… Τρόπος Β: ζητάω ΟΠΟΙΟ κλειδί έχει η συσκευή για '+location.hostname+' (χωρίς allowCredentials)');
      return doGet('B', []).then(function(rB){
        if (rB.ok) { R.get=true; R.tGet=rB.t; R.err='A fail '+rA.t+'s '+rA.name+' / B ok'; line('✅ Τρόπος Β ξεκλείδωσε σε '+rB.t+'s. ΠΕΡΑΣΕ με τον Β.', 'ok'); }
        else { R.get=false; R.err='A '+rA.t+'s '+rA.name+' / B '+rB.t+'s '+rB.name; line('❌ Τρόπος Β απέτυχε σε '+rB.t+'s: '+rB.name+' — '+rB.msg, 'bad'); }
        summary();
      });
    });
  };

  b4.onclick = function(){
    var s = sum.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(s).then(function(){ line('📋 Αντιγράφηκε. Στείλ\' το στον Claude.', 'mid'); }, function(){ line('Δεν αντιγράφηκε — κράτα τη γραμμή με το χέρι.', 'mid'); }); }
    else { line('Δεν αντιγράφηκε — κράτα τη γραμμή με το χέρι.', 'mid'); }
  };
})();
</script>
</body>
</html>
