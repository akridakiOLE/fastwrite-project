<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Μετακομίσαμε — Kostometro</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0a0e14;color:#e6edf3;font:16px/1.6 system-ui,-apple-system,sans-serif;
       text-align:center;padding:24px}
  .w{max-width:22rem}
  h1{font-size:1.4rem;margin:0 0 .6rem}
  a{display:inline-block;margin-top:1.2rem;padding:.8rem 1.4rem;border-radius:10px;
    background:#2f81f7;color:#fff;text-decoration:none;font-weight:600}
  p{color:#9aa7b4;margin:.4rem 0}
</style>
</head>
<body>
<div class="w">
  <h1>Το Hand Control λέγεται τώρα Kostometro</h1>
  <p>Η εφαρμογή μετακόμισε σε νέα διεύθυνση.</p>
  <p>Αν την είχες εγκαταστήσει, <strong>σβήσε το παλιό εικονίδιο</strong> και εγκατέστησέ την ξανά από εδώ.</p>
  <a id="go" href="/kostometro/">Άνοιξε το Kostometro</a>
</div>
<script>
// Αυτοκαταστροφή του παλιού service worker και των cache του.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function (rs) {
    rs.forEach(function (r) { if (r.scope.indexOf('/hc/') > -1) { r.unregister(); } });
  }).catch(function () {});
}
if (window.caches) {
  caches.keys().then(function (ks) {
    ks.forEach(function (k) { if (k.indexOf('hc-') === 0) { caches.delete(k); } });
  }).catch(function () {});
}
document.getElementById('go').href = '/kostometro/' + location.search;
setTimeout(function () { location.replace('/kostometro/' + location.search); }, 4000);
</script>
</body>
</html>
