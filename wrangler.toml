# Cloudflare Worker config για το fastwrite.tech.
#
# Σερβίρει τον φάκελο site/ ως static assets. Από 14/8/2026 υπάρχει ΚΑΙ κώδικας
# (src/worker.js) που καλύπτει ΜΟΝΟ τρία endpoints του ερωτηματολογίου:
#   GET  /gnomi              (καταγραφή άφιξης, μετά σερβίρει το static)
#   POST /api/gnomi/e        (συμβάντα χωνιού)
#   POST /api/gnomi/submit   (απαντήσεις)
# Οτιδήποτε άλλο πέφτει αυτούσιο στα assets — η υπόλοιπη σελίδα δεν αλλάζει.
#
# _headers και _redirects μέσα στο site/ εφαρμόζονται αυτόματα.
# Custom domains (fastwrite.tech + www.fastwrite.tech) ρυθμίζονται από το
# Cloudflare dashboard, όχι από εδώ.

# name πρέπει να ταιριάζει με αυτό που το CI παράγει αυτόματα από το repo name.
name = "fastwrite-project"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Explicit settings (εξαλείφουν warnings από το build log):
workers_dev = true
preview_urls = true

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"
# ⚠ ΠΡΟΣΟΧΗ — ΜΑΘΗΜΑ 14/8/2026:
# Ό,τι ΔΕΝ είναι σε αυτή τη λίστα πάει ΠΡΩΤΑ στα static assets. Τα assets
# απαντούν 405 σε POST και ο worker ΔΕΝ καλείται ποτέ. Με λίστα ["/gnomi"]
# έσπασαν αμέσως και τα δύο API και η υποβολή της φόρμας γύριζε σφάλμα.
# Τα API endpoints ΠΡΕΠΕΙ να είναι εδώ μέσα.
# ⚠ ΜΟΝΟ μοτίβα με αστερίσκο δουλεύουν. Ακριβής διαδρομή χωρίς "*" αγνοείται
# σιωπηλά (δοκιμάστηκε 14/8: "/gnomi/apotelesmata" έβγαζε 404). Γι' αυτό ΚΑΘΕ
# δυναμικό route του worker ζει κάτω από /api/.
run_worker_first = ["/api/*"]

# D1 — ο ΙΔΙΟΣ λογαριασμός βάσης με τον beta worker, ΞΕΧΩΡΙΣΤΟΙ πίνακες
# (gnomi_events, gnomi_responses). Σχήμα: schema/gnomi.sql
[[d1_databases]]
binding = "DB"
database_name = "fastwrite-beta-downloads"
database_id = "153089e9-11bd-4051-b0bd-a62438fec07e"

# R2 — οι σφραγισμένοι φάκελοι του Kostometro (Brief Α, Α350 §9.8 Η.1).
# Ένα κρυπτογραφημένο μπλοκ ανά λογαριασμό: <folder_id>/folder.bin. Ο server
# δεν το ανοίγει.
# 3/9/2026: το bucket ζει σε ΔΙΚΑΙΟΔΟΣΙΑ ΕΕ (Α300 §2, 2/9). Η δικαιοδοσία
# ορίζεται ΜΟΝΟ στη δημιουργία και δεν αλλάζει — γι' αυτό νέο όνομα, όχι το
# παλιό fastwrite-km (δημιουργήθηκε 2/9 χωρίς δικαιοδοσία, από setup_km_cloud.bat).
# Δημιουργείται ΜΙΑ φορά, πριν το deploy (setup_km_r2_eu.bat):
#   npx wrangler r2 bucket create fastwrite-km-eu --jurisdiction eu
# Χωρίς αυτό το CI αποτυγχάνει (binding σε bucket που δεν υπάρχει).
# ⚠ Το "jurisdiction" ΕΔΩ είναι υποχρεωτικό: binding χωρίς αυτό δεν βρίσκει
# bucket που ζει σε δικαιοδοσία.
[[r2_buckets]]
binding = "FOLDERS"
bucket_name = "fastwrite-km-eu"
jurisdiction = "eu"

# ⏰ ΧΡΟΝΟΙ ΤΗΡΗΣΗΣ (Πολιτική Απορρήτου v2.0 §5) — προστέθηκε 14/9/2026.
# Μία φορά την ημέρα, 03:00 UTC (06:00 Λευκωσίας). Καλεί το scheduled() του
# src/worker.js, που σβήνει ό,τι πέρασε το ρολόι του: ταφόπετρες 36 μηνών,
# γνώμες 24, ερωτηματολόγιο 24.
# ⚠ Μετρημένο 14/9 στην τεκμηρίωση Cloudflare: τα Cron Triggers ΥΠΑΡΧΟΥΝ στο
# δωρεάν πλάνο (5 ανά λογαριασμό) με 10 ms CPU ανά εκτέλεση. Ο χρόνος
# αναμονής στη D1 δεν μετράει ως CPU. ΔΕΝ χρειάζεται Workers Paid.
[triggers]
crons = ["0 3 * * *"]

# 📧 EMAIL SENDING (Brief Ε §6) — προστέθηκε 14/9/2026.
# Στέλνει τις δύο ειδοποιήσεις: διαγραφή λογαριασμού · αλλαγή 12 λέξεων.
# Αποστολέας: noreply@notify.fastwrite.tech — ΥΠΟΤΟΜΕΑΣ, όχι το apex.
# ⚠ Ο λόγος είναι κρίσιμος: το onboarding του Email Sending προσθέτει MX, SPF,
# DKIM και DMARC. Στο apex θα συγκρούονταν με το Google Workspace που δέχεται
# το support@ (ένα μόνο SPF επιτρέπεται ανά domain). Στο notify.fastwrite.tech
# μπήκαν όλα κάτω από cf-bounce.notify.* και το apex έμεινε ανέπαφο.
# Απαιτεί Workers Paid, ενεργοποιήθηκε 14/9/2026.
[[send_email]]
name = "EMAIL"

# 🔍 Τα Workers Logs ανάφθηκαν χειροκίνητα 14/9. Γραμμένα ΚΑΙ εδώ ώστε μια
# μελλοντική ανάπτυξη να μην τα σβήσει σιωπηλά — χωρίς logs, μια αποτυχημένη
# προγραμματισμένη εκτέλεση δεν γίνεται αντιληπτή από κανέναν.
[observability]
enabled = true
