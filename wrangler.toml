# Cloudflare Workers (with Static Assets) config για το fastwrite.tech static site.
#
# Σερβίρει τον φάκελο site/ ως static assets. Δεν χρειάζεται build step ή
# JavaScript Worker code — το Cloudflare σερβίρει αυτόματα τα HTML/CSS/JS αρχεία.
#
# _headers και _redirects μέσα στο site/ εφαρμόζονται αυτόματα.
# Custom domains (fastwrite.tech + www.fastwrite.tech) ρυθμίζονται από το
# Cloudflare dashboard, όχι από εδώ.

# name πρέπει να ταιριάζει με αυτό που το CI παράγει αυτόματα από το repo name.
# Διορθώθηκε από "fastwrite-tech" → "fastwrite-project" για να εξαλειφθεί το
# warning "Failed to match Worker name" στο build log.
name = "fastwrite-project"
compatibility_date = "2024-11-01"

# Explicit settings (εξαλείφουν warnings από το build log):
# Κρατάμε ενεργό το .workers.dev URL ως backup για debugging/staging.
workers_dev = true
# Κρατάμε ενεργά τα preview URLs για feature branches (μελλοντική χρήση).
preview_urls = true

[assets]
directory = "./site"
not_found_handling = "404-page"
